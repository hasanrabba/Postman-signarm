[package]
name = "signarm-signal-launcher"
version = "0.1.0"
edition = "2021"
description = "Self-extracting single-file launcher for Signarm Signal"

[[bin]]
name = "SignarmSignal"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
