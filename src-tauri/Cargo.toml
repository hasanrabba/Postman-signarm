[package]
name = "signarm-signal"
version = "0.1.0"
description = "Signarm Signal — API platform (desktop)"
authors = ["Signarm"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "SignarmSignal"
path = "src/main.rs"

[lib]
name = "signarm_signal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
base64 = "0.22"
url = "2"
parking_lot = "0.12"

[features]
# Tauri uses this feature to decide whether to serve the bundled frontend
# through the custom `tauri://` protocol (release builds) or fall back to
# the dev URL. Without `custom-protocol` enabled, the release binary tries
# to connect to http://localhost:3000 and the window shows
# "ERR_CONNECTION_REFUSED".
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
